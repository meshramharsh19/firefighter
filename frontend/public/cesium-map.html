<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drone</title>

  <link href="https://cesium.com/downloads/cesiumjs/releases/1.96/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.96.0/Cesium.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #map-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

  <div id="map-container"></div>

  <button id="btnGetRouteApi" style="display:none;"></button>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="assets/js/globel.js"></script>
  <script src="assets/js/map_new_16Oct_UpdatedSearch.js"></script>

  <script>
    console.log("🚀 Map loaded");

    initMap();

    let incidentLat = null;
    let incidentLng = null;
    let vehicleDeviceId = null;

    let stationLat = null;
    let stationLng = null;

    let routeInterval = null;
    let lastRouteKey = null;

    // ----------------- CLEAR EVERYTHING ROUTE RELATED -----------------
    function clearOldRoute() {

      if (!window.viewer) return;

      try {

        console.log("🗑️ Clearing previous route...");

        // Remove all entities except base map entities
        const entities = [...window.viewer.entities.values];

        entities.forEach(entity => {
          try {
            window.viewer.entities.remove(entity);
          } catch (e) { }
        });

        // Remove datasource entities if route is stored there
        if (window.viewer.dataSources) {

          const dataSources = [...window.viewer.dataSources._dataSources];

          dataSources.forEach(ds => {
            try {
              window.viewer.dataSources.remove(ds, true);
            } catch (e) { }
          });
        }

        // Common globals used by route scripts
        if (window.routeEntity) {
          try {
            window.viewer.entities.remove(window.routeEntity);
          } catch (e) { }
          window.routeEntity = null;
        }

        if (window.routePolyline) {
          try {
            window.viewer.entities.remove(window.routePolyline);
          } catch (e) { }
          window.routePolyline = null;
        }

        if (window.routeLayer) {
          try {
            window.viewer.entities.remove(window.routeLayer);
          } catch (e) { }
          window.routeLayer = null;
        }

        if (window.vehicleMarker) {
          try {
            window.viewer.entities.remove(window.vehicleMarker);
          } catch (e) { }
          window.vehicleMarker = null;
        }

        console.log("✅ Previous route cleared");

      } catch (err) {
        console.error("❌ Clear route error:", err);
      }
    }

    // ----------------- EXECUTE ROUTE -----------------
    function executeRoute() {

      if (
        typeof getRoute !== "function" ||
        incidentLat == null ||
        incidentLng == null ||
        stationLat == null ||
        stationLng == null ||
        !vehicleDeviceId
      ) {
        return false;
      }

      const routeKey =
        incidentLat +
        "_" +
        incidentLng +
        "_" +
        stationLat +
        "_" +
        stationLng +
        "_" +
        vehicleDeviceId;

      if (lastRouteKey === routeKey) {
        return true;
      }

      // IMPORTANT
      clearOldRoute();

      lastRouteKey = routeKey;

      console.log("🧭 Drawing NEW route");

      setTimeout(() => {

        getRoute(
          String(incidentLat),
          String(incidentLng),
          String(stationLat),
          String(stationLng),
          [vehicleDeviceId]
        );

      }, 300);

      return true;
    }

    // ----------------- WAIT -----------------
    function waitForRouteAndCall() {

      if (routeInterval) {
        clearInterval(routeInterval);
        routeInterval = null;
      }

      if (executeRoute()) {
        return;
      }

      routeInterval = setInterval(() => {

        if (executeRoute()) {
          clearInterval(routeInterval);
          routeInterval = null;
        }

      }, 500);
    }

    // ----------------- INCIDENT -----------------
    window.setIncidentLocation = function (lat, lng, deviceId) {

      lat = Number(lat);
      lng = Number(lng);

      const changed =
        incidentLat !== lat ||
        incidentLng !== lng ||
        vehicleDeviceId !== deviceId;

      incidentLat = lat;
      incidentLng = lng;
      vehicleDeviceId = deviceId;

      if (changed) {

        console.log("📍 INCIDENT CHANGED");

        lastRouteKey = null;

        clearOldRoute();

        waitForRouteAndCall();
      }
    };

    // ----------------- STATION -----------------
    window.setStationLocation = function (lat, lng) {

      lat = Number(lat);
      lng = Number(lng);

      const changed =
        stationLat !== lat ||
        stationLng !== lng;

      stationLat = lat;
      stationLng = lng;

      if (changed) {

        console.log("🏢 STATION CHANGED");

        lastRouteKey = null;

        clearOldRoute();

        waitForRouteAndCall();
      }
    };

    // ----------------- DEBUG -----------------
    window.getCurrentRouteState = function () {
      return {
        incidentLat,
        incidentLng,
        stationLat,
        stationLng,
        vehicleDeviceId,
        lastRouteKey,
        entityCount: window.viewer
          ? window.viewer.entities.values.length
          : 0
      };
    };
  </script>


</body>

</html>
